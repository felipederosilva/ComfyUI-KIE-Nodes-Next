[project]
name = "kie-ai-nodes-next"
version = "0.3.5"
description = "Individual KIE.ai model nodes for ComfyUI with live catalog sync, one-time credentials, and native media I/O."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Felipe Silva / community" }]
dependencies = [
  "requests>=2.31.0",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
]

[project.urls]
Documentation = "https://docs.kie.ai/"
# Add the final public GitHub Repository URL before publishing to the Comfy Registry.

[tool.comfy]
